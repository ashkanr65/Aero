[package]
name = "aero-rust-browser"
version = "1.0.4"
description = "Aero Browser with a native Rust backend"
authors = ["Aero Team"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.3", features = ["unstable", "devtools"] }
tokio = { version = "1", features = ["sync", "time"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.11.1"
base64 = "0.22.1"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.3.4"
rfd = "0.16"
arboard = "3"
dirs = "7"
csv = "1"
ed25519-dalek = "3"
semver = "1"
sha2 = "0.10"
adblock = "0.13.2"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled", "backup"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-future = { version = "0.3.2", features = ["std"] }
windows = { version = "0.62.2", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_WinRT", "Win32_System_Com", "Win32_Globalization", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[features]
default = []
custom-protocol = ['tauri/custom-protocol']

