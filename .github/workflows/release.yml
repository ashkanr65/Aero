name: Aero portable release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aero-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  portable:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Build prerequisites
        run: |
          rustup update stable --no-self-update
          if($LASTEXITCODE){exit $LASTEXITCODE}
          rustup default stable
          if($LASTEXITCODE){exit $LASTEXITCODE}
          npm ci --no-audit --no-fund
      - name: Check the tag matches the release version
        shell: pwsh
        run: |
          $version=(Get-Content package.json -Raw|ConvertFrom-Json).version
          if($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version"){throw "Tag $($env:GITHUB_REF_NAME) does not match version $version."}
      - name: Build Windows portable
        run: npm run package:portable
      # The signing key only reaches the publishing step, never the build. The
      # publisher signs and publishes the signed release when the key is present
      # and publishes the unsigned portable otherwise.
      - name: Publish the portable to the Releases section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AERO_UPDATE_PRIVATE_KEY: ${{ secrets.AERO_UPDATE_PRIVATE_KEY }}
          AERO_UPDATE_PRIVATE_KEY_PASSWORD: ${{ secrets.AERO_UPDATE_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/publish-portable.cjs
          if($LASTEXITCODE){exit $LASTEXITCODE}
